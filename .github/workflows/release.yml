# Publishing a GitHub release publishes the package to npm as @jonibach/postcard, after the same
# checks CI runs. Authentication is npm trusted publishing (OIDC): there's no npm token stored in
# the repo. The release tag must match package.json's version (v0.2.1 for 0.2.1).
name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Already on npm?
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "This version is already on npm: tests still run, nothing is published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 'true'
      - run: npm publish
        if: steps.published.outputs.skip != 'true'
